spring.application.name=facturacion negocio

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aplicacionFacturacion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
server.address=0.0.0.0
server.forward-headers-strategy=framework


jwt.secret=${JWT_SECRET}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

server.servlet.context-path=/api/v1

app.time-zone=${APP_TIME_ZONE:America/Bogota}
spring.jackson.time-zone=${app.time-zone}

fiscal.scheduler.delay-ms=${SCHEDULER_DELAY:60000}

jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

factus.base-url=${FACTUS_URL}
factus.username=${FACTUS_USERNAME}
factus.password=${FACTUS_PASSWORD}
factus.client-id=${FACTUS_CLIENTID}
factus.client-secret=${FACTUS_CLIENTSECRET}
factus.prefijo-code=${FACTUS_PREFIJO:}

establecimiento.nombre=${ESTABLECIMIENTO_NOMBRE}
establecimiento.nit=${ESTABLECIMIENTO_NIT}
establecimiento.direccion=${ESTABLECIMIENTO_DIRECCION}
establecimiento.telefono=${ESTABLECIMIENTO_TELEFONO}
establecimiento.email=${ESTABLECIMIENTO_EMAIL}
establecimiento.logo-archivo=${ESTABLECIMIENTO_LOGO_ARCHIVO:}
establecimiento.municipaly=${ESTABLECIMIENTO_MUNICIPALY}

tirilla.factura.logo-directory=${TIRILLA_FACTURA_LOGO_DIRECTORY:/logos}

superadmin.nombre=${SUPERADMIN_NOMBRE}
superadmin.username=${SUPERADMIN_USERNAME}
superadmin.password=${SUPERADMIN_PASSWORD}
superadmin.email=${SUPERADMIN_EMAIL}

#electronicaHabilitada=${ELECTRONICA_HABILITADA:false}

app.crypto.secret=${APP_CRYPTO_SECRET}

dian.software.id=${DIAN_SOFTWARE_ID:}
dian.software.pin=${DIAN_SOFTWARE_PIN:}
dian.hab.url=${DIAN_URL:}
dian.certificate.path=${DIAN_CERTIFICATE_PATH:}
dian.certificate.password=${DIAN_CERTIFICATE_PASSWORD:}

