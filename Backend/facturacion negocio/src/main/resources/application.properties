spring.application.name=facturacion negocio

# Datasource (dev defaults via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aplicacionFacturacion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:***REMOVED***
spring.datasource.password=***REMOVED***
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Mostrar consultas SQL
spring.jpa.show-sql=true
# Formatear SQL bonito
spring.jpa.properties.hibernate.format_sql=true

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=***REMOVED***
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200, http://172.20.10.4:4200}

server.servlet.context-path=/api/v1

# Zona horaria de negocio para conversion de fechas locales a Instant.
app.time-zone=${APP_TIME_ZONE:America/Bogota}
spring.jackson.time-zone=${app.time-zone}

#tiempo que tarda es scheduler en enviar las peticiones
fiscal.scheduler.delay-ms=60000

# URL base del entorno de pruebas o produccion
factus.base-url=https://api-sandbox.factus.com.co
factus.username=***REMOVED***
factus.password=***REMOVED***
factus.client-id=***REMOVED***
factus.client-secret=***REMOVED***
factus.prefijo-code=***REMOVED***

