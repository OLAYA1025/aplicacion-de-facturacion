spring.application.name=facturacion negocio

# Datasource (dev defaults via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/facturacion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Mostrar consultas SQL
spring.jpa.show-sql=true
# Formatear SQL bonito
spring.jpa.properties.hibernate.format_sql=true

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200, http://172.20.10.4:4200}

server.servlet.context-path=/api/v1

# Zona horaria de negocio para conversion de fechas locales a Instant.
app.time-zone=${APP_TIME_ZONE:America/Bogota}
spring.jackson.time-zone=${app.time-zone}

#tiempo que tarda es scheduler en enviar las peticiones
fiscal.scheduler.delay-ms=60000

# URL base del entorno de pruebas o produccion
factus.base-url=${FACTUS_URL:https://api-sandbox.factus.com.co}
factus.username=${FACTUS_USERNAME:}
factus.password=${FACTUS_PASSWORD:}
factus.client-id=${FACTUS_CLIENTID:}
factus.client-secret=${FACTUS_CLIENTSECRET:}
factus.prefijo-code=${FACTUS_PREFIJO:}

# datos del establecimiento
establecimiento.nombre=${ESTABLECIMIENTO_NOMBRE:Establecimiento de prueba}
establecimiento.nit=${ESTABLECIMIENTO_NIT:}
establecimiento.dv=${ESTABLECIMIENTO_DV:}
establecimiento.direccion=${ESTABLECIMIENTO_DIRECCION:}
establecimiento.telefono=${ESTABLECIMIENTO_TELEFONO:}
establecimiento.email=${ESTABLECIMIENTO_EMAIL:}
establecimiento.logo-archivo=${ESTABLECIMIENTO_LOGO_ARCHIVO:}
#FACTUS
establecimiento.municipaly=${ESTABLECIMIENTO_MUNICIPALY:80}
#DIAN (codigo DANE)
establecimiento.municipality-code-dian=${ESTABLECIMIENTO_MUNICIPALY_CODE_DIAN:05001}

dian.software.id=${DIAN_SOFTWARE_ID:}
dian.software.pin=${DIAN_SOFTWARE_PIN:}
dian.hab.url=${DIAN_URL:}

dian.certificate.path=${DIAN_CERTIFICATE_PATH:}
dian.certificate.password=${DIAN_CERTIFICATE_PASSWORD:}

logging.level.com.openhtmltopdf=ERROR

# Directorio externo donde se buscan logos para las tirillas.
# Se puede usar negocio.logoArchivo o la convencion negocio-{id}.png/jpg/jpeg/webp/gif.
tirilla.factura.logo-directory=${TIRILLA_FACTURA_LOGO_DIRECTORY:./logos}


superadmin.nombre=${SUPERADMIN_NOMBRE:Super Administrador}
superadmin.username=${SUPERADMIN_USERNAME:}
superadmin.password=${SUPERADMIN_PASSWORD:}
superadmin.email=${SUPERADMIN_EMAIL:}

electronicaHabilitada=${ELECTRONICA_HABILITADA:false}

app.crypto.secret=${APP_CRYPTO_SECRET}
