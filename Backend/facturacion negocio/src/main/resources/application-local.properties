spring.application.name=facturacion negocio

# Datasource (dev defaults via env)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/aplicacionFacturacion}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:***REMOVED***
spring.datasource.password=***REMOVED***
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Server
server.port=${SERVER_PORT:8080}

# JWT
jwt.secret=***REMOVED***
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
server.servlet.context-path=/api/v1

#tiempo que tarda es scheduler en enviar las peticiones
fiscal.scheduler.delay-ms=10000

# URL base del entorno de pruebas o producción
factus.base-url=${FACTUS_URL}
factus.username=***REMOVED***
factus.password=***REMOVED***
factus.client-id=***REMOVED***
factus.client-secret=***REMOVED***

# datos del establecimiento
establecimiento.nombre=***REMOVED***
establecimiento.nit=***REMOVED***
establecimiento.direccion=***REMOVED***
establecimiento.telefono=***REMOVED***
establecimiento.email=***REMOVED***
establecimiento.municipaly=***REMOVED***

logging.level.com.openhtmltopdf=ERROR
