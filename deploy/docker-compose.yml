services:
  backend:
    build: ./backend
    container_name: facturacion_backend
    env_file:
      - .env
    volumes:
      - ${LOGOS_HOST_DIRECTORY}:/logos
      - ${DIAN_CERTIFICATE_HOST_PATH:-./secrets/dian-certificate.p12}:/run/secrets/dian-certificate.p12:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: facturacion_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: facturacion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${BACKUP_HOST_DIRECTORY:-./backups-data}:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 
