services:
  backend:
    build: ./backend
    container_name: facturacion_backend
    env_file:
      - .env
    volumes:
      - ${LOGOS_HOST_DIRECTORY}:/logos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    build: ./nginx
    container_name: facturacion_nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: facturacion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: facturacion
      POSTGRES_USER: ***REMOVED***
      POSTGRES_PASSWORD: ***REMOVED***
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups-data:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d facturacion"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 
