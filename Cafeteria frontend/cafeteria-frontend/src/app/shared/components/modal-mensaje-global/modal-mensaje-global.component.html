<div
  *ngIf="estado().visible"
  class="fixed inset-0 z-[500] flex items-center justify-center bg-black/55 p-4 backdrop-blur-sm"
  (click)="onFondoClick()"
  role="presentation"
>
  <section
    class="w-full max-w-sm rounded-2xl bg-white px-6 py-7 text-center shadow-2xl dark:bg-gray-900"
    (click)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="estado().titulo"
  >
    <span
      class="mx-auto inline-flex h-16 w-16 items-center justify-center rounded-full border-2"
      [ngClass]="
        esError
          ? 'border-red-300 text-red-400 dark:border-red-400/70 dark:text-red-300'
          : 'border-emerald-300 text-emerald-500 dark:border-emerald-400/70 dark:text-emerald-300'
      "
    >
      <svg
        *ngIf="esError"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.2"
        stroke="currentColor"
        class="h-9 w-9"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>

      <svg
        *ngIf="!esError"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="2.2"
        stroke="currentColor"
        class="h-9 w-9"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
    </span>

    <h3 class="mt-5 text-3xl font-semibold leading-tight text-gray-800 dark:text-gray-100">
      {{ estado().titulo }}
    </h3>

    <p *ngIf="estado().mensaje" class="mt-2 text-sm text-gray-600 dark:text-gray-300">
      {{ estado().mensaje }}
    </p>

    <div class="mt-8 flex items-center justify-center gap-3">
      <button
        *ngIf="estado().mostrarCancelar"
        type="button"
        (click)="onCancelar()"
        class="rounded-md border border-gray-300 px-4 py-2 text-sm font-semibold text-gray-700 transition-colors hover:bg-gray-100 dark:border-gray-700 dark:text-gray-200 dark:hover:bg-gray-800"
      >
        {{ estado().textoCancelar }}
      </button>

      <button
        type="button"
        (click)="onConfirmar()"
        class="rounded-md px-5 py-2 text-sm font-semibold text-white transition-colors"
        [ngClass]="
          esError
            ? 'bg-blue-600 hover:bg-blue-700'
            : 'bg-emerald-600 hover:bg-emerald-700'
        "
      >
        {{ estado().textoConfirmar }}
      </button>
    </div>
  </section>
</div>
