<section class="mx-auto w-full max-w-4xl space-y-4">
  <header class="rounded-2xl border border-gray-200 bg-white p-5 shadow-sm">
    <h1 class="text-xl font-semibold text-gray-900">Perfil</h1>
    <p class="mt-1 text-sm text-gray-600">Información de tu cuenta actual.</p>
  </header>

  <div
    *ngIf="loading"
    class="rounded-2xl border border-gray-200 bg-white p-5 text-sm text-gray-600 shadow-sm"
  >
    Cargando perfil...
  </div>

  <div
    *ngIf="!loading && errorMensaje"
    class="rounded-2xl border border-red-200 bg-red-50 p-4 text-sm text-red-700"
  >
    {{ errorMensaje }}
  </div>

  <div
    *ngIf="!loading && usuario as perfil"
    class="overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm"
  >
    <div class="grid grid-cols-1 divide-y divide-gray-100 md:grid-cols-2 md:divide-x md:divide-y-0">
      <div class="space-y-1 p-5">
        <p class="text-xs uppercase tracking-wide text-gray-500">Rol</p>
        <p class="text-sm font-medium text-gray-900">{{ perfil.rol }}</p>
      </div>
      <div class="space-y-1 p-5">
        <p class="text-xs uppercase tracking-wide text-gray-500">Nombre</p>
        <p class="text-sm font-medium text-gray-900">{{ perfil.nombre || '-' }}</p>
      </div>
      <div class="space-y-1 p-5">
        <p class="text-xs uppercase tracking-wide text-gray-500">Usuario</p>
        <p class="text-sm font-medium text-gray-900">{{ perfil.username }}</p>
      </div>
      <div class="space-y-1 p-5 md:col-span-2">
        <p class="text-xs uppercase tracking-wide text-gray-500">Correo</p>
        <p class="text-sm font-medium text-gray-900">{{ perfil.email || '-' }}</p>
      </div>
    </div>
  </div>
</section>
