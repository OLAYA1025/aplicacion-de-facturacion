<div
  *ngIf="visible"
  class="fixed right-4 top-20 z-[130] w-full max-w-sm rounded-xl border border-emerald-200 bg-white p-4 shadow-xl"
>
  <div class="flex items-start">
    <span class="mt-0.5 inline-flex h-7 w-7 items-center justify-center rounded-full bg-emerald-100 text-emerald-700">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.4" stroke="currentColor" class="h-4 w-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
      </svg>
    </span>
    <div class="min-w-0 flex-1">
      <p class="text-sm font-semibold text-emerald-800">Producto creado</p>
      <p class="mt-0.5 text-sm text-gray-700">{{ mensaje }}</p>
    </div>
    <button
      type="button"
      (click)="onCerrar()"
      class="rounded-md p-1 text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600"
      aria-label="Cerrar notificación"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.2" stroke="currentColor" class="h-4 w-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
</div>
