<div class="min-h-screen p-4 sm:p-6">
  <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">Pedidos</h1>
      <p class="text-sm text-gray-600 mt-1">Gestiona los pedidos de la caja actual</p>
    </div>

    <button
      *ngIf="vistaActual === 'lista'"
      (click)="nuevoPedido()"
      class="flex w-full items-center justify-center gap-2 px-5 py-3 sm:w-auto bg-indigo-600 text-white rounded-xl hover:from-indigo-700 hover:to-purple-700 transform hover:scale-105 transition-all shadow-lg hover:shadow-xl"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
      <span class="font-semibold">Nuevo Pedido</span>
    </button>
  </div>

  <div *ngIf="vistaActual === 'lista'">
    <div *ngIf="loading" class="flex justify-center items-center py-20">
      <div class="relative">
        <div class="inline-block h-12 w-12 animate-spin rounded-full border-4 border-solid border-indigo-600 border-r-transparent"></div>
        <div class="absolute inset-0 h-12 w-12 animate-ping rounded-full bg-indigo-400 opacity-20"></div>
      </div>
    </div>

    <div *ngIf="!loading">
      <div *ngIf="pedidosPendientes.length === 0" class="bg-white  rounded-2xl shadow-lg border border-gray-200 p-16 text-center">
        <div class="inline-flex items-center justify-center w-24 h-24 bg-gray-100 black:bg-gray-600 rounded-full mb-6">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 text-indigo-600 ">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
            />
          </svg>
        </div>
        <h3 class="text-2xl font-bold text-gray-900 mb-3">No hay pedidos pendientes</h3>
        <p class="text-gray-500 mb-6 max-w-md mx-auto">Comienza creando un nuevo pedido para tus clientes</p>
        <button
          (click)="nuevoPedido()"
          class="inline-flex items-center gap-2 px-6 py-3 bg-indigo-600 text-white rounded-xl hover:from-indigo-700 hover:to-purple-700 transform hover:scale-105 transition-all shadow-lg font-semibold"
        >
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
          </svg>
          Crear Primer Pedido
        </button>
      </div>

      <div *ngIf="pedidosPendientes.length > 0" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
        <app-pedido-card
          *ngFor="let pedido of pedidosPendientes"
          [pedido]="pedido"
          (editar)="editarPedido($event)"
          (cobrar)="cobrarPedidoPendiente($event)"
          (cancelar)="cancelarPedido($event)"
        ></app-pedido-card>
      </div>
    </div>
  </div>

  <div *ngIf="vistaActual === 'crear' || vistaActual === 'editar'">
    <app-formulario-pedido
      [vistaActual]="vistaActual"
      [pedidoEditandoId]="pedidoEditando?.id ?? null"
      [nombreCliente]="nombreCliente"
      [detallesTemp]="detallesTemp"
      [totalPedido]="totalPedido"
      [guardando]="guardando"
      (volver)="volverALista()"
      (nombreClienteChange)="actualizarNombreCliente($event)"
      (abrirModalProductos)="abrirModalProductos()"
      (eliminarDetalle)="eliminarDetalle($event)"
      (aumentarCantidad)="aumentarCantidadDetalle($event)"
      (disminuirCantidad)="disminuirCantidadDetalle($event)"
      (guardarPedido)="crearPedido()"
      (cancelar)="volverALista()"
    ></app-formulario-pedido>
  </div>
</div>

<app-modal-productos
  [visible]="mostrarModalProductos"
  [busquedaProducto]="busquedaProducto"
  [categorias]="categorias"
  [categoriaSeleccionada]="categoriaSeleccionada"
  [productos]="productos"
  [productosFiltrados]="productosFiltrados"
  [detallesSeleccionados]="detallesTemp"
  (cerrar)="cerrarModalProductos()"
  (busquedaChange)="actualizarBusquedaProducto($event)"
  (categoriaChange)="seleccionarCategoria($event)"
  (agregarProducto)="agregarProducto($event)"
  (cantidadProductoChange)="actualizarCantidadProductoDesdeModal($event)"
></app-modal-productos>

<app-modal-decision
  [visible]="mostrarModalDecision"
  [pedido]="pedidoRecienCreado"
  (cobrarAhora)="irACobrar()"
  (dejarPendiente)="dejarPendiente()"
></app-modal-decision>

<app-modal-cobro
  [visible]="mostrarModalCobro"
  [pedido]="pedidoRecienCreado"
  (cerrar)="cerrarModalCobro()"
  (cobroRealizado)="onCobroRealizado()"
></app-modal-cobro>
