<div class="bg-white rounded-2xl shadow-xl border border-gray-200 overflow-hidden">
  <div class="bg-indigo-600 px-6 py-5 flex items-center justify-between">
    <div class="flex items-center gap-4">
      <button (click)="volver.emit()" class="p-2.5 bg-white/20 hover:bg-white/30 rounded-xl transition-colors backdrop-blur-sm">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5 text-white">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
        </svg>
      </button>
      <div>
        <h2 class="text-2xl font-bold text-white">
          {{ vistaActual === 'crear' ? 'Nuevo Pedido' : 'Editar Pedido #' + pedidoEditandoId }}
        </h2>
        <p class="text-indigo-100 text-sm mt-1">Selecciona productos y ajusta cantidades</p>
      </div>
    </div>
  </div>

  <div class="p-6">
    <div class="mb-6">
      <label class="text-sm font-bold text-gray-900 mb-2 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5 text-indigo-600">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
          />
        </svg>
        Nombre del Pedido
      </label>
      <input
        type="text"
        [ngModel]="nombreCliente"
        (ngModelChange)="onNombreClienteChange($event)"
        placeholder="Ingresa el nombre del pedido"
        class="w-full px-4 py-3.5 border-2 border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-lg font-medium"
      />
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 space-y-4">
        <button
          (click)="abrirModalProductos.emit()"
          class="w-full p-8 border-2 border-dashed border-indigo-300 rounded-2xl hover:border-indigo-500 hover:bg-indigo-50 transition-all group"
        >
          <div class="flex flex-col items-center gap-4">
            <div class="p-4 bg-indigo-100 rounded-full group-hover:bg-indigo-200 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-12 h-12 text-indigo-600">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
              </svg>
            </div>
            <div class="text-center">
              <h3 class="text-xl font-bold text-gray-900 mb-2">Agregar Productos</h3>
              <p class="text-gray-600 text-sm">Click para seleccionar productos del catálogo</p>
            </div>
          </div>
        </button>

        <div *ngIf="detallesTemp.length > 0" class="bg-indigo-50 border border-indigo-200 rounded-xl p-4">
          <div class="flex items-center gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5 text-indigo-600">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
            <p class="text-sm font-medium text-indigo-900">
              {{ detallesTemp.length }} {{ detallesTemp.length === 1 ? 'producto agregado' : 'productos agregados' }}
            </p>
          </div>
        </div>
      </div>

      <div class="lg:col-span-1">
        <app-resumen-pedido
          [detallesTemp]="detallesTemp"
          [totalPedido]="totalPedido"
          [nombreCliente]="nombreCliente"
          [vistaActual]="vistaActual"
          [guardando]="guardando"
          (eliminarDetalle)="eliminarDetalle.emit($event)"
          (aumentarCantidad)="aumentarCantidad.emit($event)"
          (disminuirCantidad)="disminuirCantidad.emit($event)"
          (guardar)="guardarPedido.emit()"
          (cancelar)="cancelar.emit()"
        ></app-resumen-pedido>
      </div>
    </div>
  </div>
</div>
