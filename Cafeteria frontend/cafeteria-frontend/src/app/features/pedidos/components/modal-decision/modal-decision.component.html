<div
  *ngIf="visible"
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm p-4"
>
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg transform scale-100 transition-all">
    <div class="bg-indigo-600 px-6 py-5 rounded-t-2xl">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-white/20 rounded-xl">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-7 h-7 text-white"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
            />
          </svg>
        </div>
        <div>
          <h3 class="text-2xl font-bold text-white">¡Pedido Creado!</h3>
          <p class="text-indigo-100 text-sm mt-1">El pedido se ha registrado exitosamente</p>
        </div>
      </div>
    </div>

    <div class="p-6">
      <div class="mb-6 bg-gray-50 rounded-xl p-5 border-2 border-gray-200">
        <div class="flex items-center justify-between mb-3">
          <span class="text-sm font-semibold text-gray-600">Nombre del pedido</span>
          <span class="font-bold text-gray-900 text-lg">{{ pedido?.nombre }}</span>
        </div>
        <div class="flex items-center justify-between mb-3 pt-3 border-t border-gray-300">
          <span class="text-sm font-semibold text-gray-600">Pedido #</span>
          <span class="font-bold text-indigo-600">{{ pedido?.id }}</span>
        </div>
        <div class="flex items-center justify-between pt-3 border-t border-gray-300">
          <span class="text-sm font-semibold text-gray-600">Total</span>
          <span class="text-3xl font-black bg-indigo-600 bg-clip-text text-transparent">
            {{ formatearMonto(pedido?.total || 0) }}
          </span>
        </div>
      </div>

      <div class="text-center mb-6">
        <h4 class="text-lg font-bold text-gray-900 mb-2">¿Qué deseas hacer?</h4>
        <p class="text-gray-600 text-sm">El pedido está guardado como pendiente</p>
      </div>

      <div class="space-y-3">
        <button
          (click)="cobrarAhora.emit()"
          class="w-full px-5 py-4 bg-emerald-500 text-white font-bold rounded-xl hover:from-green-600 hover:to-emerald-600 transition-all shadow-lg hover:shadow-xl transform hover:scale-105"
        >
          <div class="flex items-center justify-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"
              />
            </svg>
            <span class="text-lg">Cobrar Ahora</span>
          </div>
        </button>

        <button
          (click)="dejarPendiente.emit()"
          class="w-full px-5 py-4 bg-yellow-500  text-white font-bold rounded-xl hover:yellow-600  transition-all shadow-lg hover:shadow-xl transform hover:scale-105"
        >
          <div class="flex items-center justify-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="2"
              stroke="currentColor"
              class="w-6 h-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
              />
            </svg>
            <span class="text-lg">Dejar Pendiente</span>
          </div>
        </button>
      </div>
    </div>
  </div>
</div>
