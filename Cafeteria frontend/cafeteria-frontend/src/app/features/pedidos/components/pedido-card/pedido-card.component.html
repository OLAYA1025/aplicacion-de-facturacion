<div
  class="bg-white  rounded-2xl shadow-md border border-gray-200 overflow-hidden hover:shadow-xl hover:border-indigo-300 transition-all duration-300 transform hover:-translate-y-1"
>
  <div class="bg-gray-100 px-5 py-4 border-b border-gray-200">
    <div class="flex items-center justify-between mb-2">
      <span
        class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-bold rounded-full bg-orange-100 text-yellow-600 shadow-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="w-3.5 h-3.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
          />
        </svg>
        PENDIENTE
      </span>
      <span class="text-xs font-semibold text-gray-600 bg-white px-2 py-1 rounded-full">
        #{{ pedido.id }}
      </span>
    </div>
    <h3 class="font-bold text-gray-900 text-lg truncate">{{ pedido.nombre }}</h3>
    <div class="flex items-center gap-1.5 text-xs text-gray-600 mt-1">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="w-3.5 h-3.5"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
        />
      </svg>
      {{ formatearFecha(pedido.fecha) }}
    </div>
  </div>

  <div class="p-5">
    <div class="space-y-2 mb-4 max-h-36 overflow-y-auto custom-scrollbar">
      <div
        *ngFor="let detalle of pedido.detalles"
        class="flex justify-between items-center text-sm py-1.5 px-2 rounded-lg hover:bg-gray-50 transition-colors"
      >
        <div class="flex items-center gap-2 flex-1 min-w-0">
          <span
            class="inline-flex items-center justify-center w-6 h-6 bg-indigo-100 text-indigo-700 rounded-full text-xs font-bold flex-shrink-0"
          >
            {{ detalle.cantidad }}
          </span>
          <span class="text-gray-700 truncate">{{ detalle.productoNombre }}</span>
        </div>
        <span class="font-semibold text-gray-900 ml-2 flex-shrink-0">
          {{ formatearMonto(detalle.subtotal) }}
        </span>
      </div>
    </div>

    <div class="bg-indigo-50 rounded-xl p-4 mb-4 border border-indigo-100">
      <div class="flex justify-between items-center">
        <span class="text-sm font-semibold text-indigo-900">Total del Pedido</span>
        <span class="text-2xl font-bold bg-indigo-600 bg-clip-text text-transparent">
          {{ formatearMonto(pedido.total) }}
        </span>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-2">
      <button
        (click)="onEditar()"
        class="px-3 py-2.5 border-2 border-gray-300 text-gray-700 rounded-xl hover:bg-gray-50 hover:border-indigo-300 transition-all font-medium text-sm"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-4 h-4 mx-auto mb-0.5"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931Zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0 1 15.75 21H5.25A2.25 2.25 0 0 1 3 18.75V8.25A2.25 2.25 0 0 1 5.25 6H10"
          />
        </svg>
        Editar
      </button>
      <button
        (click)="onCobrar()"
        class="col-span-2 px-3 py-2.5 bg-emerald-500 text-white rounded-xl hover:from-green-600 hover:to-emerald-600 transition-all font-semibold text-sm shadow-md hover:shadow-lg transform hover:scale-105"
      >
        <div class="flex items-center justify-center gap-1.5">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="w-4 h-4"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z"
            />
          </svg>
          Cobrar
        </div>
      </button>
    </div>

    <button
      (click)="onCancelar()"
      class="w-full mt-2 px-3 py-2 border-2 border-red-200 text-red-600 rounded-xl hover:bg-red-50 hover:border-red-300 transition-all font-medium text-sm"
    >
      <div class="flex items-center justify-center gap-1.5">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-4 h-4"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
        Cancelar Pedido
      </div>
    </button>
  </div>
</div>
