<div class="flex h-[100dvh] overflow-hidden bg-gray-100">
  <app-admin-sidebar
    [collapsed]="sidebarCollapsed()"
    [mobileOpen]="mobileOpen()"
    (toggleSidebar)="toggleSidebar()"
    (closeMobile)="mobileOpen.set(false)"
  />

  <div class="flex min-h-0 min-w-0 flex-1 flex-col bg-gray-100">
    <app-admin-topbar (menuClick)="toggleMobile()" (collapseClick)="toggleSidebar()" />

    <main
      class="flex-1 min-w-0 overflow-y-auto overflow-x-hidden overscroll-y-contain bg-gray-100 px-4 pt-4 pb-[calc(1rem+env(safe-area-inset-bottom))] sm:p-6"
    >
      <router-outlet />
    </main>
  </div>
</div>
