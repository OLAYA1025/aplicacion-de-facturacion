<header class="flex h-[calc(4rem+env(safe-area-inset-top))] w-full min-w-0 items-center justify-between gap-2 border-b-2 border-gray-100 bg-white px-3 pt-[env(safe-area-inset-top)] shadow-sm sm:px-6">

  <!-- Left -->
  <div class="flex min-w-0 items-center gap-2 sm:gap-4">
    <!-- Mobile button -->
    <button
      class="lg:hidden p-2 rounded hover:bg-gray-100"
      (click)="menuClick.emit()">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Desktop collapse -->
    <button
      class="hidden lg:block p-2 rounded hover:bg-gray-100 transition-colors"
      (click)="collapseClick.emit()"
      aria-label="Contraer sidebar">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="hover:text-indigo-600 w-6 h-6 text-gray-600">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M12 17.25h8.25" />
      </svg>
    </button>

    <span class="max-w-[8.5rem] truncate text-sm font-semibold text-gray-700 sm:max-w-none sm:text-base">
      {{ pageTitle }}
    </span>
  </div>

  <!-- Right (toggle + user) -->
<div class="flex items-center gap-2 sm:gap-3">
  <!-- Theme toggle -->
  <button
      type="button"
      (click)="toggleTheme()"
      [class.animate-theme-pulse]="themeAnimating"
      class="relative inline-flex items-center justify-center overflow-hidden
            rounded-full border border-gray-200 bg-white shadow-sm transition
            hover:shadow-md active:scale-[0.98]
            focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500/60 focus-visible:ring-offset-2
            dark:border-white/10 dark:bg-slate-900
            text-slate-700 dark:text-slate-200
            h-10 w-10 sm:w-[76px]"
      aria-label="Alternar tema"
    >
      <!-- Mobile (icon-only) -->
      <span class="relative inline-flex h-6 w-6 items-center justify-center sm:hidden">
        <span class="absolute inset-0 flex items-center justify-center text-amber-500 transition-all duration-300 opacity-0 scale-75 dark:scale-100 dark:opacity-100">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
          </svg>
        </span>
        <span class="absolute inset-0 flex items-center justify-center text-slate-700 transition-all duration-300 dark:scale-75 dark:opacity-0 dark:text-slate-200 ">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
          </svg>
        </span>
      </span>

      <!-- Desktop+ (pill) -->
      <span class="hidden sm:block absolute inset-0 rounded-full
                  bg-gray-100
                  dark:bg-slate-800"></span>

      <!-- Icons -->
      <span class="hidden sm:block absolute left-2 z-10 text-amber-500 transition-all duration-300 dark:opacity-35"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z" />
        </svg>
      </span>
      <span class="hidden sm:block absolute right-2 z-10 text-slate-700 transition-all duration-300 opacity-30 dark:opacity-100 dark:text-slate-200"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z" />
</svg>
</span>

      <!-- Knob -->
      <span
        class="hidden sm:inline-flex absolute z-10 top-1 left-1 h-8 w-8 items-center justify-center
              rounded-full bg-white shadow ring-1 ring-black/5 transition-transform duration-300
              dark:bg-slate-800 dark:ring-white/10 dark:translate-x-[36px]"
      ></span>
    </button>

    <!-- Right avatar / dropdown -->
    <div class="relative" (keydown.escape)="closeDropdown()" tabindex="0">
      <!-- Trigger -->
      <div
        (click)="toggleDropdown()"
        class="flex items-center gap-2 cursor-pointer select-none
               rounded-full px-2 py-1
               hover:bg-black/5 active:bg-black/10 transition"
      >
        <div
          class="h-8 w-8 rounded-full bg-indigo-600/90
                 flex items-center justify-center
                 ring-1 ring-black/5 shadow-sm"
        >
          <span class="text-[11px] font-semibold tracking-wide text-white">
            {{ iniciales }}
          </span>
        </div>

        <span class="hidden max-w-[8rem] truncate text-sm font-medium text-gray-800 sm:inline">
          {{ username }}
        </span>

        <span
          class="ml-1 hidden text-gray-500 transition-transform duration-150 sm:inline"
          [class.rotate-180]="isOpen"
          aria-hidden="true"
        >
          ▾
        </span>
      </div>

      <div
        *ngIf="isOpen"
        (click)="closeDropdown()"
        class="fixed inset-0 z-40"
      ></div>

      <!-- Dropdown -->
      <div
        *ngIf="isOpen"
        class="absolute right-0 mt-2 w-56 z-50 origin-top-right
               rounded-2xl border border-black/5 bg-white/80 backdrop-blur-md
               shadow-[0_20px_50px_-20px_rgba(0,0,0,0.35)]
               transition-all duration-150 ease-out"
        [ngClass]="isOpen
          ? 'opacity-100 translate-y-0 scale-100 pointer-events-auto'
          : 'opacity-0 translate-y-1 scale-95 pointer-events-none'"
      >
        <div class="px-4 py-3">
          <p class="text-[13px] font-semibold text-gray-900">Cuenta</p>
          <p class="text-[12px] text-gray-600 truncate">{{ email }}</p>
        </div>

        <div class="h-px bg-black/5"></div>

        <div class="p-1">
          <button
            type="button"
            class="w-full rounded-xl px-3 py-2 text-left text-[13px] text-gray-900
                   hover:bg-black/5 active:bg-black/10 transition"
            (click)="goToProfile(); closeDropdown()"
          >
            Perfil
          </button>

          <button
            (click)="logout(); closeDropdown()"
            type="button"
            class="w-full rounded-xl px-3 py-2 text-left text-[13px] text-red-600
                   hover:bg-red-500/10 active:bg-red-500/15 transition"
          >
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>

</header>
