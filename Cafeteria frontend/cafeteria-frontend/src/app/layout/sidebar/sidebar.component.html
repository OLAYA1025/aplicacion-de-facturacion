<!-- Overlay móvil -->
<div
  *ngIf="mobileOpen"
  class="fixed inset-0 z-40 bg-black/40 lg:hidden"
  (click)="closeMobile.emit()">
</div>

<!-- Sidebar -->
<div 
  class="fixed top-0 border-r-2 border-gray-100 left-0 z-50 h-full bg-white shadow-lg transition-all duration-300 lg:static lg:z-auto lg:shadow-none" 
  [ngClass]="{
    'w-64': !collapsed,
    'w-20': collapsed,
    'translate-x-0': mobileOpen,
    '-translate-x-full': !mobileOpen,
    'lg:translate-x-0': true
  }">

  <!-- Header -->
  <div class="flex h-16 items-center justify-between px-4">
    
    <!-- Logo/Title -->
    <span 
      *ngIf="!collapsed" 
      class="text-xl font-bold text-gray-800 transition-opacity duration-300">
      Montara
    </span>

    <!-- Toggle button (Desktop) -->
    <button
      (click)="toggleSidebar.emit()"
      class="hidden rounded p-2 text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:block"
      [attr.aria-label]="collapsed ? 'Expandir sidebar' : 'Contraer sidebar'">
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" 
        class="h-6 w-6">
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
    </button>

    <!-- Close button (Mobile) -->
    <button
      (click)="closeMobile.emit()"
      class="rounded p-2 text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:hidden"
      aria-label="Cerrar menú">
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" 
        class="h-6 w-6">
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

  </div>

  <!-- Navigation -->
  <nav class="mt-4 space-y-1 px-3">

    <!-- Caja -->
    <a 
      routerLink="/caja"
      routerLinkActive="border-r-2 border-indigo-500 bg-indigo-50 text-indigo-600"
      class="group relative flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
      [class.justify-center]="collapsed">

      <!-- Icon -->
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" 
        routerLinkActive= "dark:drop-shadow-[0_0_10px_rgba(99,102,241)]"
        class="h-6 w-6 flex-shrink-0 transition-colors group-hover:text-indigo-600">
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
      </svg>

      <!-- Label -->
      <span 
        *ngIf="!collapsed"
        class="truncate">
        Inicio
      </span>

      <!-- Tooltip (solo en desktop cuando está colapsado) -->
      <span 
        *ngIf="collapsed"
        class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block">
        Inicio
      </span>

    </a>

    <!-- Pedidos -->
    <a 
      routerLink="/pedidos"
      routerLinkActive="border-r-2 border-indigo-500 bg-indigo-50 text-indigo-600"
      class="group relative flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
      [class.justify-center]="collapsed">

      <!-- Icon -->
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" 
        routerLinkActive= "dark:drop-shadow-[0_0_10px_rgba(99,102,241)]"
        class="h-6 w-6 flex-shrink-0 transition-colors group-hover:text-indigo-600">
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
      </svg>


      <!-- Label -->
      <span 
        *ngIf="!collapsed"
        class="truncate">
        Pedidos
      </span>

      <!-- Tooltip -->
      <span 
        *ngIf="collapsed"
        class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block">
        Pedidos
      </span>

    </a>

    <!-- Estadisticas -->
    <a
      routerLink="/estadisticas"
      routerLinkActive="border-r-2 border-indigo-500 bg-indigo-50 text-indigo-600"
      class="group relative flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
      [class.justify-center]="collapsed">

      <!-- Icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        routerLinkActive= "dark:drop-shadow-[0_0_10px_rgba(99,102,241)]"
        class="h-6 w-6 flex-shrink-0 transition-colors group-hover:text-indigo-600">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M3 3v18h18M7.5 15.75V10.5m4.5 5.25V6.75m4.5 9V12" />
      </svg>

      <!-- Label -->
      <span
        *ngIf="!collapsed"
        class="truncate">
        Estadisticas
      </span>

      <!-- Tooltip -->
      <span
        *ngIf="collapsed"
        class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block">
        Estadisticas
      </span>

    </a>

    <!-- Compras con subrutas -->
    <div>
      <button
        (click)="toggleCompras()"
        class="group relative flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
        [class.justify-center]="collapsed"
        [class.border-r-2]="comprasExpanded"
        [class.border-indigo-500]="comprasExpanded"
        [class.bg-indigo-50]="comprasExpanded"
        [class.text-indigo-600]="comprasExpanded"
      >


        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          [ngClass]="{'dark:drop-shadow-[0_0_10px_rgba(99,102,241)]': comprasExpanded }"
          class="h-6 w-6 flex-shrink-0 transition-colors group-hover:text-indigo-600">
          
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="m9 14.25 6-6m4.5-3.493V21.75l-3.75-1.5-3.75 1.5-3.75-1.5-3.75 1.5V4.757c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0 1 11.186 0c1.1.128 1.907 1.077 1.907 2.185ZM9.75 9h.008v.008H9.75V9Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm4.125 4.5h.008v.008h-.008V13.5Zm.375 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z"
          />
        </svg>

        <span *ngIf="!collapsed" class="flex-1 truncate text-left"> Compras </span>

        <svg
          *ngIf="!collapsed"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          [ngClass]="{'dark:drop-shadow-[0_0_5px_rgba(99,102,241)]': comprasExpanded }"
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="comprasExpanded"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>

        <span
          *ngIf="collapsed"
          class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block"
        >
          Compras
        </span>
      </button>

      <div
        *ngIf="!collapsed && comprasExpanded"
        class="ml-3 mt-1 space-y-1 border-l-2 border-gray-200 pl-4"
      >
        <a
          routerLink="/compras/listado"
          routerLinkActive="text-indigo-600 font-semibold"
          class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600"
        >
          Lista de compras
        </a>

        <a
          routerLink="/compras/nueva"
          routerLinkActive="text-indigo-600 font-semibold"
          class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600"
        >
          Registrar compra
        </a>
      </div>
    </div>

    <!-- Proveedores con subrutas -->
    <div>
      <button
        (click)="toggleProveedores()"
        class="group relative flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
        [class.justify-center]="collapsed"
        [class.border-r-2]="proveedoresExpanded"
        [class.border-indigo-500]="proveedoresExpanded"
        [class.bg-indigo-50]="proveedoresExpanded"
        [class.text-indigo-600]="proveedoresExpanded"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          [ngClass]="{'dark:drop-shadow-[0_0_10px_rgba(99,102,241)]': proveedoresExpanded }"
          class="h-6 w-6 flex-shrink-0"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Zm6-10.125a1.875 1.875 0 1 1-3.75 0 1.875 1.875 0 0 1 3.75 0Zm1.294 6.336a6.721 6.721 0 0 1-3.17.789 6.721 6.721 0 0 1-3.168-.789 3.376 3.376 0 0 1 6.338 0Z"
          />
        </svg>

        <span *ngIf="!collapsed" class="flex-1 truncate text-left"> Proveedores </span>

        <svg
          *ngIf="!collapsed"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          [ngClass]="{'dark:drop-shadow-[0_0_5px_rgba(99,102,241)]': proveedoresExpanded }"
          class="h-4 w-4 transition-transform"
          [class.rotate-180]="proveedoresExpanded"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
        </svg>

        <span
          *ngIf="collapsed"
          class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block"
        >
          Proveedores
        </span>
      </button>

      <div
        *ngIf="!collapsed && proveedoresExpanded"
        class="ml-3 mt-1 space-y-1 border-l-2 border-gray-200 pl-4"
      >
        <a
          routerLink="/proveedores/listado"
          routerLinkActive="text-indigo-600 font-semibold"
          class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600"
        >
          Lista proveedores
        </a>

        <a
          routerLink="/proveedores/nuevo"
          routerLinkActive="text-indigo-600 font-semibold"
          class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600"
        >
          Nuevo proveedor
        </a>
      </div>
    </div>

     <!-- Inventario con subrutas -->
<div>
  <!-- Botón principal -->
  <button
    (click)="toggleInventario()"
    class="group relative flex w-full items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
    [class.justify-center]="collapsed"
    [class.border-r-2]="inventarioExpanded"
    [class.border-indigo-500]="inventarioExpanded"
    [class.bg-indigo-50]="inventarioExpanded"
    [class.text-indigo-600]="inventarioExpanded">

    <!-- Icon -->
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      fill="none" 
      viewBox="0 0 24 24" 
      stroke-width="1.5" 
      stroke="currentColor" 
      [ngClass]="{'dark:drop-shadow-[0_0_10px_rgba(99,102,241)]': inventarioExpanded }"
      class="h-6 w-6 flex-shrink-0">
      <path 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
    </svg>

    <!-- Label -->
    <span 
      *ngIf="!collapsed"
      class="flex-1 truncate text-left">
      Productos
    </span>

    <!-- Chevron (solo cuando no está colapsado) -->
    <svg 
      *ngIf="!collapsed"
      xmlns="http://www.w3.org/2000/svg" 
      fill="none" 
      viewBox="0 0 24 24" 
      stroke-width="2" 
      stroke="currentColor" 
      [ngClass]="{'dark:drop-shadow-[0_0_5px_rgba(99,102,241)]': inventarioExpanded }"
      class="h-4 w-4 transition-transform"
      [class.rotate-180]="inventarioExpanded">
      <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
    </svg>

    <!-- Tooltip (cuando está colapsado) -->
    <span 
      *ngIf="collapsed"
      class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block">
      Productos
    </span>
  </button>

  <!-- Subrutas (solo visibles cuando no está colapsado Y está expandido) -->
  <div 
    *ngIf="!collapsed && inventarioExpanded"
    class="ml-3 mt-1 space-y-1 border-r-2 border-gray-200 pl-4">
    
    <!-- Productos inventariables -->
    <a 
      routerLink="/productos/inventariables"
      routerLinkActive="text-indigo-600 font-semibold"
      class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600">
      Inventario
    </a>

    <a 
      routerLink="/productos/preparaciones"
      routerLinkActive="text-indigo-600 font-semibold"
      class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600">
      Preparaciones
    </a>

    <!-- Crear Producto -->
    <a 
      routerLink="/productos/crear-producto"
      routerLinkActive="text-indigo-600 font-semibold"
      class="block rounded-md px-3 py-2 text-sm text-gray-600 transition-colors hover:bg-gray-100 hover:text-indigo-600">
      Crear Producto
    </a>

  </div>
</div>

    <!-- Pro -->
    <a 
      routerLink="/usuarios"
      routerLinkActive="border-r-2 border-indigo-500 bg-indigo-50 text-indigo-600"
      class="group relative flex items-center gap-3 rounded-md px-3 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 hover:text-indigo-600 lg:text-base"
      [class.justify-center]="collapsed">

      <!-- Icon -->
      <svg 
        xmlns="http://www.w3.org/2000/svg" 
        fill="none" 
        viewBox="0 0 24 24" 
        stroke-width="1.5" 
        stroke="currentColor" 
        class="h-6 w-6 flex-shrink-0">
        <path 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
      </svg>

      <!-- Label -->
      <span 
        *ngIf="!collapsed"
        class="truncate">
        Usuarios
      </span>

      <!-- Tooltip -->
      <span 
        *ngIf="collapsed"
        class="absolute left-full ml-3 hidden whitespace-nowrap rounded bg-gray-800 px-2 py-1 text-xs text-white opacity-0 transition-opacity group-hover:opacity-100 lg:block">
        Usuarios
      </span>

    </a>

  </nav>

  
</div>
